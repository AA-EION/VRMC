# SPDX-License-Identifier: GPL-3.0-only
#
# Serves the VRMC XR client and the pairing service on WEB_PORT (default 8080).
#
# There is no reverse proxy here on purpose: this is meant to sit behind one you
# already run. Point your existing nginx at http://127.0.0.1:${WEB_PORT} and let
# it terminate TLS.
#
#   docker compose up -d --build
#
# TLS upstream is not optional. WebXR only runs in a secure context, so a client
# reached over plain http:// cannot enter an immersive session — the headset
# loads the page and then refuses to start. See docs/WEB-DEPLOYMENT.md.

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: vrmc-web:latest
    container_name: vrmc-web
    restart: unless-stopped
    environment:
      # Wildcard domain whose subdomains resolve to private addresses, so a
      # headset can reach a bridge on the LAN over a genuinely valid
      # certificate. See docs/PAIRING.md.
      LAN_DOMAIN: ${LAN_DOMAIN:-lan.vrmc.eionstudios.com}
    ports:
      # Bound to loopback: the only thing that should reach this container is
      # the proxy on the same host. Publishing on 0.0.0.0 would expose a plain
      # HTTP port to the network, which is both unnecessary and a way to reach
      # the site while bypassing TLS.
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
