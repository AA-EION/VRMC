# SPDX-License-Identifier: GPL-3.0-only
name: Release binaries

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Each platform builds on its own runner.
#
# The packaging script can assemble every target from one machine, because the
# native MIDI addons ship prebuilds for all platforms. Building on the native
# runner anyway buys two things worth having: the artifact is exercised on the
# OS it targets before release, and macOS builds are in a position to be signed
# and notarised, which cannot happen elsewhere.
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-26, not macos-latest: the app targets macOS 26, and a runner
          # image one version behind carries an SDK that cannot compile for it
          # — swiftc refuses, the tray helper is not produced, and the assertion
          # below turns that into a failed release rather than a silent one.
          - os: macos-26
            target: macos-arm64
          - os: windows-latest
            target: windows-x64
          - os: ubuntu-latest
            target: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # Version comes from package.json's `packageManager`; setting it here
      # too makes the action fail.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @vrmc/protocol --filter @vrmc/layout --filter @vrmc/interaction --filter @vrmc/devices build
      - run: pnpm --filter @vrmc/desktop-bridge run bundle

      # The tray helper is a native GUI binary — AppKit on macOS, the Win32
      # shell on Windows — so unlike the prebuilt addons it cannot be selected
      # and copied from another machine. This is why the matrix exists.
      - name: Build the tray helper
        if: runner.os != 'Windows'
        run: node native/build.mjs
        working-directory: apps/desktop-bridge

      # Windows needs the compiler on PATH first: cl.exe and rc.exe only exist
      # inside a Developer Command Prompt. vswhere is shipped by the Visual
      # Studio installer and is already on the runner, so the environment is
      # located with Microsoft's own tooling rather than by adding a
      # third-party action to the supply chain for one `call`.
      - name: Build the tray helper (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        working-directory: apps/desktop-bridge
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set VSPATH=%%i
          if not defined VSPATH exit /b 1
          call "%VSPATH%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          node native/build.mjs || exit /b 1

      # The CoreMIDI driver, so the app can install it without a download.
      #
      # Before packaging, because packaging stages whatever is in the driver's
      # build directory — and after the tray helper for no reason but reading
      # order. macOS only: a CoreMIDI driver plugin has no meaning elsewhere,
      # and `copyCoreMidiDriver` skips a build that has none rather than
      # failing.
      - name: Build the CoreMIDI driver
        if: runner.os == 'macOS'
        run: native/coremidi-driver/build.sh

      - run: node build/package.mjs ${{ matrix.target }}
        working-directory: apps/desktop-bridge

      # The driver has to be *in* the app for --install-driver to have anything
      # to install, and it has to carry its own signature once it is there:
      # what MIDIServer checks is the plugin, not the app it came out of. A
      # missing or unsigned one is a silent failure at install time, on the
      # user's machine, which is the worst place to find it.
      - name: The driver must be bundled and signed
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          APP=$(find apps/desktop-bridge/build/dist -maxdepth 2 -name 'VRMC Bridge.app' | sed -n 1p)
          test -n "$APP" || { echo "no .app was assembled"; exit 1; }
          PLUGIN="$APP/Contents/Resources/VRMC.plugin"
          test -d "$PLUGIN" || { echo "the driver was not staged into the app"; exit 1; }
          # Its own signature, checked on its own. The app's signature seals it
          # in place, but what MIDIServer validates once it has been copied to
          # ~/Library/Audio/MIDI Drivers is the plugin standing alone.
          codesign --verify --strict --verbose=2 "$PLUGIN"
          nm -gU "$PLUGIN/Contents/MacOS/VRMC" | grep -q VrmcDriverFactory
          echo "bundled and signed: $PLUGIN"

      # Fail loudly if the icon did not make it into the build. A bridge with
      # no tray icon still carries MIDI, so nothing else here would notice —
      # and the user would simply have no way to read their pairing code.
      - name: The tray helper must be packaged
        if: runner.os != 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          name=vrmc-tray
          [ "${{ runner.os }}" = "Windows" ] && name=vrmc-tray.exe
          found=$(find apps/desktop-bridge/build/dist -name "$name" | sed -n 1p)
          test -n "$found" || { echo "no $name in the staged build"; exit 1; }
          echo "packaged $found"

      # The dashboard window, and that it is genuinely universal.
      #
      # A helper missing the architecture it is asked to run on does not fail
      # loudly — the window simply never opens, with nothing said anywhere. So
      # the slices are asserted rather than assumed, on the artifact people
      # download.
      - name: The dashboard must be packaged, universal
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          found=$(find apps/desktop-bridge/build/dist -name vrmc-dashboard | sed -n 1p)
          test -n "$found" || { echo "no vrmc-dashboard in the staged build"; exit 1; }
          archs=$(lipo -archs "$found")
          echo "packaged $found ($archs)"
          grep -q arm64 <<<"$archs" || { echo "no arm64 slice"; exit 1; }
          grep -q x86_64 <<<"$archs" || { echo "no x86_64 slice"; exit 1; }

      # The signature has to be real, and this is the only place it can be
      # checked: `codesign` exists on no other runner.
      #
      # `--verify --deep --strict` is the step that catches a bundle signed in
      # the wrong order — signing itself never complains about that, and the
      # first person to notice would otherwise be somebody whose Mac says the
      # app is damaged. See build/codesign.mjs.
      - name: The app must be signed
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          APP=$(find apps/desktop-bridge/build/dist -maxdepth 2 -name 'VRMC Bridge.app' | sed -n 1p)
          test -n "$APP" || { echo "no .app was assembled"; exit 1; }
          codesign --verify --deep --strict --verbose=2 "$APP"
          # For the record in the build log: which identity, and what it sealed.
          codesign -dvv "$APP" 2>&1
          # Every nested binary individually, because a bundle can verify while
          # a library inside it carries somebody else's signature.
          #
          # A `find -exec` loop would not do: find returns its own exit status,
          # not the command's, so a failing codesign in here would pass the step
          # silently — which is the exact failure mode this check exists to
          # catch. Read them and check each one.
          #
          # The selection has to match build/codesign.mjs exactly, and the
          # obvious spelling of it is wrong: `-path '*/MacOS/*'` also matches
          # the addons' staged dependency trees, so this would run
          # `codesign --verify` against a few hundred READMEs and headers and go
          # red on the first one. Contents/MacOS *itself* is executables; the
          # tree under it is not.
          while IFS= read -r binary; do
            codesign --verify --strict "$binary" || {
              echo "nested binary is not correctly signed: $binary"
              exit 1
            }
          done < <(find "$APP" -type f \( \
               -name '*.node' -o -name '*.dylib' -o -name '*.so' \
            -o \( -path "$APP/Contents/MacOS/*" ! -path "$APP/Contents/MacOS/*/*" \) \
          \))
          echo "signature verified"

      # Smoke-test on the OS the artifact targets.
      #
      # `--check` loads every native library and exits non-zero if one is
      # missing. That specific check exists because the previous one did not
      # catch the failure it was meant to: `--list-ports` prints "no ports" just
      # as happily when the MIDI addon failed to load as when the machine has no
      # MIDI, and a packaged build shipped with *both* addons dead — no MIDI and
      # no way for a headset to connect — while every smoke test passed.
      - name: Smoke test (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          APP=$(find apps/desktop-bridge/build/dist -type f -name 'vrmc-bridge' | sed -n 1p)
          chmod +x "$APP"
          "$APP" --check
          "$APP" --list-ports
      - name: Smoke test (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          BIN=$(find apps/desktop-bridge/build/dist -type f -name 'vrmc-bridge' | sed -n 1p)
          chmod +x "$BIN"
          "$BIN" --check
          "$BIN" --help
      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Recurse apps/desktop-bridge/build/dist -Filter vrmc-bridge.exe |
            Select-Object -First 1
          if (-not $exe) { throw 'vrmc-bridge.exe was not produced' }
          & $exe.FullName --check
          if ($LASTEXITCODE -ne 0) { throw 'the packaged build is missing a native library' }
          & $exe.FullName --list-ports

      # A .dmg is what a macOS user expects to download: it mounts as a disk
      # image with the .app inside, ready to drag to Applications. Shipping a
      # bare .app in a zip loses the executable bit and the bundle structure on
      # some unarchivers.
      - name: Build .dmg
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          STAGE=$(find apps/desktop-bridge/build/dist -maxdepth 1 -mindepth 1 -type d | sed -n 1p)
          test -d "$STAGE/VRMC Bridge.app" || { echo "no .app in $STAGE"; exit 1; }
          # A symlink to /Applications makes the drag-to-install gesture obvious.
          ln -s /Applications "$STAGE/Applications"
          mkdir -p release
          hdiutil create \
            -volname "VRMC Bridge" \
            -srcfolder "$STAGE" \
            -ov -format UDZO \
            "release/vrmc-bridge-${{ matrix.target }}.dmg"
          hdiutil verify "release/vrmc-bridge-${{ matrix.target }}.dmg"

          # And check the app as it exists *inside* the image, which is the
          # thing a person actually downloads. Copying a bundle can lose
          # extended attributes and turn a valid signature into "damaged" — so
          # the artifact is verified rather than the staging directory it came
          # from.
          MOUNT=$(mktemp -d)
          hdiutil attach "release/vrmc-bridge-${{ matrix.target }}.dmg" \
            -mountpoint "$MOUNT" -nobrowse -readonly
          codesign --verify --deep --strict --verbose=2 "$MOUNT/VRMC Bridge.app"
          hdiutil detach "$MOUNT"
          echo "the app inside the dmg is correctly signed"

      # An MSI is what a Windows user expects: it puts the bridge in Program
      # Files, adds a Start menu entry, and registers it to start at login —
      # rather than asking them to keep a folder somewhere and remember to run
      # it. Deliberately not a service: services run in session 0, which has no
      # desktop and therefore no tray icon. See build/installer/vrmc.wxs.
      - name: Build the MSI
        if: runner.os == 'Windows'
        run: |
          # Extension versions pinned to the CLI's.
          #
          # Unpinned, `wix extension add` fetched the 7.0.0 extensions against a
          # 5.0.2 CLI. That is not an install failure — it warns "could not find
          # expected package root folder wixext5" and carries on — and the real
          # error arrives later as WIX0144, saying the extension could not be
          # found at all, which reads like it was never installed.
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.UI.wixext/5.0.2
          wix extension add -g WixToolset.Util.wixext/5.0.2
          node build/installer/build.mjs
        working-directory: apps/desktop-bridge

      - name: Collect Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          $msi = Get-ChildItem apps/desktop-bridge/build/dist -Filter '*.msi' |
            Select-Object -First 1
          if (-not $msi) { throw 'the MSI was not produced' }
          Copy-Item $msi.FullName "release/VRMC-Setup.msi"
          $stage = Get-ChildItem apps/desktop-bridge/build/dist -Directory | Select-Object -First 1
          # The .exe alone is not runnable: the native MIDI addon lives beside
          # it. Zip the whole folder so the two stay together, and also publish
          # the bare .exe for anyone who only wants to inspect it.
          Compress-Archive -Path "$($stage.FullName)/*" `
            -DestinationPath "release/vrmc-bridge-${{ matrix.target }}.zip"
          Copy-Item "$($stage.FullName)/vrmc-bridge.exe" `
            "release/vrmc-bridge-${{ matrix.target }}.exe"

      - name: Collect Linux build
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          mkdir -p release
          STAGE=$(find apps/desktop-bridge/build/dist -maxdepth 1 -mindepth 1 -type d | sed -n 1p)
          tar -czf "release/vrmc-bridge-${{ matrix.target }}.tar.gz" -C "$STAGE" .

      - uses: actions/upload-artifact@v4
        with:
          name: vrmc-bridge-${{ matrix.target }}
          path: release/*
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          body: |
            Desktop bridge builds.

            - `.dmg` — macOS, contains VRMC Bridge.app
            - `.exe` — Windows executable; the `.zip` beside it also carries the
              native MIDI addon the .exe needs
            - `.tar.gz` — Linux

            **macOS.** The app is signed ad-hoc, which is what stops it being
            reported as damaged on Apple Silicon — but it is not notarised, so
            macOS still asks once. Open it, let it be blocked, then go to
            System Settings > Privacy & Security and press **Open Anyway**.
            Right-click > Open is no longer a bypass on macOS 15 and later.

            If it says the app is *damaged* rather than unverified, the download
            lost its signature on the way; clear the quarantine flag and reopen:

                xattr -dr com.apple.quarantine "/Applications/VRMC Bridge.app"

            **Windows.** The executable is unsigned and SmartScreen warns until
            it has built reputation: choose More info, then Run anyway.
