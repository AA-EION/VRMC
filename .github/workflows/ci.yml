# SPDX-License-Identifier: GPL-3.0-only
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      # The render test needs a browser. Playwright's own Chromium is used
      # rather than the runner's, so the version matches the pinned library.
      - run: pnpm --filter @vrmc/xr-client exec playwright install --with-deps chromium
      - run: pnpm test
