#
# Static server for the VRMC XR client.
#
# This container sits *behind* your own reverse proxy, which terminates TLS.
# It therefore speaks plain HTTP on port 80 and does no redirecting of its own:
# a container that issued its own https:// redirects would fight the proxy in
# front of it.
#
# TLS is not optional upstream, though. WebXR only runs in a secure context, so
# a client served over plain http:// cannot enter an immersive session at all.
# See docs/WEB-DEPLOYMENT.md.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The proxy in front owns the public scheme and host. Building redirects
    # from this container's own view of them would emit http:// links on an
    # https:// site.
    absolute_redirect off;
    port_in_redirect off;

    # Do not advertise the version to the outside world.
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/wasm
        image/svg+xml;

    # Asset filenames are content-hashed by the build, so they can be cached
    # indefinitely: a changed file gets a new name rather than a new version at
    # the same name.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must never be cached, or a deploy leaves browsers loading the
    # old document and pointing at asset names that no longer exist.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    # Liveness probe for the compose healthcheck and for an upstream proxy.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Single-page app: unknown paths fall back to the document rather than 404,
    # so the client can be mounted under any route the proxy chooses.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # WebXR needs no special headers when same-origin. If this page is ever
    # embedded in an iframe on another origin, the *parent* must grant
    # `xr-spatial-tracking`; it cannot be granted from here.
}
